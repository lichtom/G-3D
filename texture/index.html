<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纹理转换器 — G-3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117; color: #c9d1d9;
      min-height: 100vh; padding: 2.5em 1.5em;
      display: flex; flex-direction: column; align-items: center;
    }
    a.back {
      position: fixed; top: 1.2em; left: 1.5em;
      color: #8b949e; text-decoration: none; font-size: .9rem;
      transition: color .15s;
    }
    a.back:hover { color: #58a6ff; }
    h1 {
      font-size: 1.9rem; margin-bottom: 1.4em;
      color: #e6edf3; font-weight: 700;
    }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 1.6em 2em;
      width: 100%; max-width: 560px; margin-bottom: 1.2em;
    }
    /* Upload */
    .upload-zone {
      border: 2px dashed #30363d; border-radius: 10px;
      padding: 3em 1em; text-align: center;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .upload-zone:hover,
    .upload-zone.dragover { border-color: #58a6ff; background: rgba(88,166,255,.05); }
    .upload-zone .icon { font-size: 2.4rem; margin-bottom: .4em; }
    .upload-zone .hint { color: #484f58; font-size: .82rem; margin-top: .4em; }
    /* Controls */
    .ctrl-row { display: flex; align-items: center; gap: .8em; margin-bottom: .7em; }
    .ctrl-row:last-child { margin-bottom: 0; }
    .ctrl-row label { min-width: 60px; color: #8b949e; font-size: .88rem; flex-shrink: 0; }
    .ctrl-row input[type=range] { flex: 1; accent-color: #58a6ff; }
    .badge {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 6px; padding: .18em .55em;
      font-size: .82rem; color: #58a6ff; font-weight: 600;
      min-width: 68px; text-align: center; flex-shrink: 0;
    }
    .info-row {
      display: flex; justify-content: space-between;
      font-size: .82rem; color: #484f58; margin-top: .9em;
    }
    /* Canvas area */
    .canvas-wrap {
      display: flex; flex-direction: column; align-items: center; gap: .8em;
    }
    .pixel-box {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; padding: .8em;
      display: inline-block; image-rendering: pixelated;
    }
    .pixel-box canvas { display: block; image-rendering: pixelated; }
    .orig-box { max-width: 100%; overflow: hidden; text-align: center; }
    .orig-box img {
      max-width: 100%; max-height: 140px;
      border-radius: 6px; display: block; margin: 0 auto;
    }
    .canvas-label { font-size: .75rem; color: #484f58; }
    /* Button */
    .dl-btn {
      display: block; width: 100%; max-width: 560px;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff; border: none; border-radius: 10px;
      padding: .95em; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: filter .15s;
      margin-bottom: 1.2em;
    }
    .dl-btn:hover { filter: brightness(1.15); }
    .dl-btn:disabled { opacity: .4; cursor: default; filter: none; }
    /* Preview text */
    .preview-card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 1.2em 1.5em;
      width: 100%; max-width: 560px; margin-bottom: 2em;
    }
    .preview-card h3 { font-size: .88rem; color: #8b949e; margin-bottom: .7em; font-weight: 600; }
    .preview-card pre {
      font-size: .72rem; color: #7ee787;
      background: #0d1117; border-radius: 6px;
      padding: 1em; max-height: 180px; overflow: auto;
      white-space: pre-wrap; word-break: break-all;
      line-height: 1.5;
    }
    .hidden { display: none !important; }
    footer { font-size: .78rem; color: #30363d; }
  </style>
</head>
<body>

  <a href="../index.html" class="back">← 返回首页</a>
  <h1>纹理转换器</h1>

  <!-- Upload -->
  <div class="card" id="uploadCard">
    <div class="upload-zone" id="dropZone">
      <div class="icon">📁</div>
      <div>点击或拖拽上传图片</div>
      <div class="hint">支持 PNG / JPG / WebP 等常见格式</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <!-- Settings -->
  <div class="card hidden" id="settingsCard">
    <div class="ctrl-row">
      <label>最大尺寸</label>
      <input type="range" id="sizeSlider" min="1" max="20" value="10">
      <span class="badge" id="sizeLabel">10×10</span>
    </div>
    <div class="info-row">
      <span id="origInfo">原始尺寸: —</span>
      <span id="outInfo">输出: — × — 像素</span>
    </div>
  </div>

  <!-- Preview -->
  <div class="card hidden" id="previewCard">
    <div class="canvas-wrap">
      <div class="pixel-box"><canvas id="pixelCanvas"></canvas></div>
      <span class="canvas-label">像素预览（放大显示）</span>
      <div class="orig-box"><img id="origImg" alt="原始图片"></div>
      <span class="canvas-label">原始图片</span>
    </div>
  </div>

  <!-- Download -->
  <button class="dl-btn hidden" id="downloadBtn">💾 保存 .Gtxr 纹理文件</button>

  <!-- Data preview -->
  <div class="preview-card hidden" id="dataPreview">
    <h3>数据预览（.Gtxr 内容）</h3>
    <pre id="dataText"></pre>
  </div>

  <footer>G-3D Texture Tool</footer>

<script>
(function () {
  /* DOM refs */
  const dropZone    = document.getElementById('dropZone');
  const fileInput   = document.getElementById('fileInput');
  const settingsCard = document.getElementById('settingsCard');
  const previewCard  = document.getElementById('previewCard');
  const sizeSlider  = document.getElementById('sizeSlider');
  const sizeLabel   = document.getElementById('sizeLabel');
  const origInfo    = document.getElementById('origInfo');
  const outInfo     = document.getElementById('outInfo');
  const pixelCanvas = document.getElementById('pixelCanvas');
  const origImg     = document.getElementById('origImg');
  const downloadBtn = document.getElementById('downloadBtn');
  const dataPreview = document.getElementById('dataPreview');
  const dataText    = document.getElementById('dataText');

  let fileName = '';
  let image    = null;
  let gtxrData = '';

  /* ---------- Upload ---------- */
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  function loadFile(file) {
    if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
    fileName = file.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(file);
    origImg.src = url;
    image = new Image();
    image.onload = () => {
      origInfo.textContent = '原始尺寸: ' + image.width + ' × ' + image.height + ' px';
      settingsCard.classList.remove('hidden');
      previewCard.classList.remove('hidden');
      downloadBtn.classList.remove('hidden');
      dataPreview.classList.remove('hidden');
      process();
    };
    image.src = url;
  }

  /* ---------- Slider ---------- */
  sizeSlider.addEventListener('input', process);

  /* ---------- Core processing ---------- */
  function calcDims(maxDim) {
    const ratio = image.width / image.height;
    let w, h;
    if (ratio >= 1) {
      w = maxDim;
      h = Math.max(1, Math.round(maxDim / ratio));
    } else {
      h = maxDim;
      w = Math.max(1, Math.round(maxDim * ratio));
    }
    return { w, h };
  }

  function process() {
    if (!image) return;
    const maxDim = parseInt(sizeSlider.value);
    const { w, h } = calcDims(maxDim);
    sizeLabel.textContent = w + ' × ' + h;
    outInfo.textContent   = '输出: ' + w + ' × ' + h + ' 像素';

    /* Draw scaled-down to offscreen canvas */
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const offCtx = off.getContext('2d');
    offCtx.imageSmoothingEnabled = true;
    offCtx.imageSmoothingQuality = 'high';
    offCtx.drawImage(image, 0, 0, w, h);
    const px = offCtx.getImageData(0, 0, w, h).data;

    /* Build 2D hex array */
    const grid = [];
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        row.push(rgbaHex(px[i], px[i + 1], px[i + 2], px[i + 3]));
      }
      grid.push(row);
    }
    gtxrData = JSON.stringify(grid, null, 2);

    /* Render enlarged preview with grid lines */
    const cell = Math.max(12, Math.floor(360 / Math.max(w, h)));
    pixelCanvas.width  = w * cell;
    pixelCanvas.height = h * cell;
    const ctx = pixelCanvas.getContext('2d');
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        ctx.fillStyle = grid[y][x].slice(0, 7);
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    /* Grid lines */
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) {
      ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, h * cell); ctx.stroke();
    }
    for (let y = 0; y <= h; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(w * cell, y * cell + .5); ctx.stroke();
    }

    /* Data preview */
    dataText.textContent = gtxrData.length > 800
      ? gtxrData.slice(0, 800) + '\n…(已截断，完整数据见下载文件)'
      : gtxrData;
  }

  function rgbaHex(r, g, b, a) {
    return '#' +
      r.toString(16).padStart(2, '0') +
      g.toString(16).padStart(2, '0') +
      b.toString(16).padStart(2, '0') +
      a.toString(16).padStart(2, '0');
  }

  /* ---------- Download ---------- */
  downloadBtn.addEventListener('click', () => {
    if (!gtxrData) return;
    const blob = new Blob([gtxrData], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName + '.Gtxr';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
